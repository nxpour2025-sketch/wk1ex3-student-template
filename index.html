
<!doctype html>
<html>
  <head>
    <title>Demo: Get Started Debugging JavaScript with Chrome DevTools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <!--
      Your task is to complete the JavaScript for a simple addition program. 
      The page already contains two input fields and a button.

      Read the values entered into the two input fields.
      Convert both values into numbers before performing the addition.
      When the button is clicked, output the sum using console.log().
      Your program must correctly handle positive and negative numbers.
      If either input is not a valid number, output exactly:

        Please enter numbers only

      Examples your program should handle correctly:
        2 + 3 → 5
        10 + 20 → 30
        -5 + 8 → 3
        abc + 5 → Please enter numbers only

      The autograder checks all four behaviours.

      You can choose to use a function do perform the above tasks.
      -->
    <script>
      function addNum(num1, num2) {
        num1 = Number(document.getElementById('num1').value);
        num2 = Number(document.getElementById('num2').value);
        if (isNaN(num1) || isNaN(num2)) {
          console.log("Please enter numbers only");
        } else {
          console.log(num1+num2); 
        }
      }
    </script>
    <h1>Demo: Get Started Debugging JavaScript with Chrome DevTools</h1>
    <label for="num1">Number 1</label>
    <input placeholder="Number 1" id="num1">
    <label for="num2">Number 2</label>
    <input placeholder="Number 2" id="num2">
    <button onclick="addNum(num1, num2)">Add Number 1 and Number 2</button>
  </body>
</html>
